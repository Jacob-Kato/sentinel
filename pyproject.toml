[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "A situational-awareness platform for environmental intelligence"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sounddevice",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

vad-webrtc = [
    "webrtcvad-wheels>=2.0.14",
]

vad-silero = [
    "onnxruntime>=1.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
